<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_main.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocioSphere - Smart Civic Society Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <style>
      /* Hide Google Translate top banner & branding for clean native look */
      .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame { display: none !important; }
      body { top: 0px !important; }
      .goog-tooltip, #goog-gt-tt { display: none !important; visibility: hidden !important; }
      .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
      #google_translate_element { display: none !important; }
      .skiptranslate iframe { display: none !important; }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-200">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="text/javascript">
      // Guarantee English default on initial boot or when English is selected
      try {
        var savedLang = localStorage.getItem("sociosphere_language");
        if (!savedLang || savedLang === "en") {
          var h = window.location.hostname;
          var p = ["/", window.location.pathname];
          var doms = ["", h, "." + h];
          doms.forEach(function(d) {
            p.forEach(function(path) {
              document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=" + path + ";" + (d ? " domain=" + d + ";" : "");
            });
          });
        }
      } catch(e) {}

      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
